[mod-name]
radar-alignment-guide=Radar Alignment Guide

[mod-description]
radar-alignment-guide=レーダーをカバー範囲の重複なく設置するためのチャンクを強調します。

[mod-setting-name]
radar-alignment-guide-highlight-color=チャンク強調色
radar-alignment-guide-show-map-tag=マップに基準レーダーを表示
radar-alignment-guide-show-hints=ヒントを表示

[mod-setting-description]
radar-alignment-guide-highlight-color=設置チャンクを強調する色。
radar-alignment-guide-show-map-tag=基準レーダーにマップ／リモートビュー用のタグを追加します。
radar-alignment-guide-show-hints=レーダーを持ったときや設置したときに、フライングテキストとアラートでヒントを表示します。チャットへの通知は常に表示されます。

[controls]
radar-alignment-guide-toggle-anchor=基準レーダーを切り替え

[radar-alignment-guide]
anchor-set-message=__1__ が基準レーダーを __2__ に設定しました
anchor-cleared-message=__1__ が基準レーダー __2__ を解除しました
anchor-auto-set-message=基準レーダーを __1__ に自動設定しました
anchor-auto-set-by-player-message=__1__ が設置したレーダー __2__ を基準レーダーに自動設定しました
anchor-bootstrap-message=Radar Alignment Guide を導入しました: 基準レーダーを __1__ に設定しました。別のレーダーにカーソルを合わせ __CONTROL__radar-alignment-guide-toggle-anchor__ で変更できます
anchor-died-message=基準レーダー __1__ が破壊されました。新しい基準レーダーを指定してください
anchor-mined-by-player-message=__1__ が基準レーダー __2__ を撤去しました。新しい基準レーダーを指定してください
anchor-mined-message=基準レーダー __1__ が撤去されました。新しい基準レーダーを指定してください
anchor-lost-message=基準レーダー __1__ がなくなりました。新しい基準レーダーを指定してください
anchor-merged-moved-message=勢力の統合にともない基準レーダーを __1__ に設定しました
anchor-merged-dropped-message=勢力の統合で基準レーダーが重複したため __1__ を破棄しました。__2__ を使用します
anchor-outranges-flying-text=基準レーダーよりカバー範囲が広いレーダーです。__CONTROL__radar-alignment-guide-toggle-anchor__ で基準に設定できます
anchor-outranges-ghost-flying-text=基準レーダーよりカバー範囲が広いレーダーです。完成後に __CONTROL__radar-alignment-guide-toggle-anchor__ で基準に設定できます
anchor-outranges-alert=基準レーダーよりカバー範囲が広いレーダーが建設されました
no-anchor-warning=基準レーダーがありません。レーダーにカーソルを合わせ __CONTROL__radar-alignment-guide-toggle-anchor__ で指定してください
no-anchor-first-radar-flying-text=最初に設置したレーダーが基準レーダーになります
migration-reset-message=MOD の更新で保存データを移行できなかったため、基準レーダーの指定をリセットしました。各基準レーダーにカーソルを合わせ __CONTROL__radar-alignment-guide-toggle-anchor__ で指定し直してください。
