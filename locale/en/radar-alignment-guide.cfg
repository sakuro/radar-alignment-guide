[mod-name]
radar-alignment-guide=Radar Alignment Guide

[mod-description]
radar-alignment-guide=Highlights chunks for placing radars without overlapping coverage.

[mod-setting-name]
radar-alignment-guide-highlight-color=Chunk highlight color
radar-alignment-guide-show-map-tag=Show anchor on map

[mod-setting-description]
radar-alignment-guide-highlight-color=Color used to highlight placement chunks.
radar-alignment-guide-show-map-tag=Add a map/remote-view tag on the anchor radar.

[controls]
radar-alignment-guide-toggle-anchor=Toggle radar alignment anchor

[radar-alignment-guide]
anchor-set-message=Radar alignment anchor set at __1__
anchor-cleared-message=Radar alignment anchor cleared
anchor-auto-set-message=Radar alignment anchor automatically set at __1__
anchor-destroyed-message=Radar alignment anchor was destroyed; designate a new one
anchor-merged-moved-message=Radar alignment anchor set at __1__ after a force merge
anchor-merged-dropped-message=Duplicate radar alignment anchor at __1__ discarded after a force merge; keeping __2__
anchor-outranges-flying-text=Wider coverage than the anchor. Press __CONTROL__radar-alignment-guide-toggle-anchor__ to make it the anchor.
no-anchor-warning=No radar alignment anchor on this surface
migration-reset-message=A mod update could not migrate saved data, so anchor designations were reset. Point at each anchor radar and press __CONTROL__radar-alignment-guide-toggle-anchor__ to designate it again.
