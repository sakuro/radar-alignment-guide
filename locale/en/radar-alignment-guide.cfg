[mod-name]
radar-alignment-guide=Radar Alignment Guide

[mod-description]
radar-alignment-guide=Highlights chunks for placing radars without overlapping coverage.

[mod-setting-name]
radar-alignment-guide-highlight-color=Chunk highlight color
radar-alignment-guide-show-map-tag=Show anchor on map
radar-alignment-guide-show-hints=Show hints

[mod-setting-description]
radar-alignment-guide-highlight-color=Color used to highlight placement chunks.
radar-alignment-guide-show-map-tag=Add a map/remote-view tag on the anchor radar.
radar-alignment-guide-show-hints=Show hints as flying text, alerts and warning icons when holding or placing a radar. Chat notifications are always shown.

[controls]
radar-alignment-guide-toggle-anchor=Toggle radar alignment anchor

[radar-alignment-guide]
anchor-set-message=__1__ set the radar alignment anchor at __2__
anchor-cleared-message=__1__ cleared the radar alignment anchor at __2__
anchor-auto-set-message=Radar alignment anchor automatically set at __1__
anchor-auto-set-by-player-message=Radar alignment anchor automatically set at __2__, built by __1__
anchor-bootstrap-message=Radar Alignment Guide added: alignment anchor set at __1__. Point at another radar and press __CONTROL__radar-alignment-guide-toggle-anchor__ to move it.
anchor-died-message=Radar alignment anchor at __1__ was destroyed; designate a new one
anchor-mined-by-player-message=__1__ removed the radar alignment anchor at __2__; designate a new one
anchor-mined-message=Radar alignment anchor at __1__ was removed; designate a new one
anchor-lost-message=Radar alignment anchor at __1__ is gone; designate a new one
anchor-merged-moved-message=Radar alignment anchor set at __1__ after a force merge
anchor-merged-dropped-message=Duplicate radar alignment anchor at __1__ discarded after a force merge; keeping __2__
anchor-outranges-flying-text=Wider coverage than the anchor. Press __CONTROL__radar-alignment-guide-toggle-anchor__ to make it the anchor.
anchor-outranges-ghost-flying-text=Wider coverage than the anchor. Once built, press __CONTROL__radar-alignment-guide-toggle-anchor__ to make it the anchor.
anchor-outranges-alert=Radar with wider coverage than the anchor built
no-anchor-warning=No radar alignment anchor. Point at a radar and press __CONTROL__radar-alignment-guide-toggle-anchor__ to designate one.
no-anchor-first-radar-flying-text=The first radar you build becomes the alignment anchor
migration-reset-message=A mod update could not migrate saved data, so anchor designations were reset. Point at each anchor radar and press __CONTROL__radar-alignment-guide-toggle-anchor__ to designate it again.
